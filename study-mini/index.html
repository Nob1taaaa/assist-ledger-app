<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assist Ledger Study Mini</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #e4e4e7; }
      main { max-width: 32rem; padding: 2rem; border: 1px solid #27272a; border-radius: 12px; background: #111113; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #6ee7b7; }
      p { margin: 0.5rem 0; font-size: 0.9rem; line-height: 1.5; color: #a1a1aa; }
      code { font-size: 0.85rem; background: #18181b; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Assist Ledger Study Mini</h1>
      <p>Minimal project for importing PRs and CI into Assist Ledger.</p>
      <p>Build: <code><!--BUILD_TIME--></code></p>
      <p>Open a PR on this repo, add study labels, then import <code>YOUR_USER/assist-ledger-study-mini</code> in the cockpit.</p>
    </main>
  </body>
</html>
